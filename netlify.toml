[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/"
  to = "/zh-CN/login"
  status = 302
  force = true

# Allow default locales under their short forms for nicer UX
[[redirects]]
  from = "/login"
  to = "/zh-CN/login"
  status = 302
  force = false

[[redirects]]
  from = "/verify"
  to = "/zh-CN/verify"
  status = 302
  force = false

[[redirects]]
  from = "/dashboard"
  to = "/zh-CN/dashboard"
  status = 302
  force = false

[[redirects]]
  from = "/en/dashboard"
  to = "/en/dashboard/"
  status = 200
  force = false

[[redirects]]
  from = "/zh-CN/dashboard"
  to = "/zh-CN/dashboard/"
  status = 200
  force = false

[[redirects]]
  from = "/zh-TW/dashboard"
  to = "/zh-TW/dashboard/"
  status = 200
  force = false
